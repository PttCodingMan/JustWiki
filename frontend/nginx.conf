server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # nginx defaults to 1 MB, which silently 413s media uploads long before
    # the backend's limit. Keep this just above the max of the admin
    # "max upload size" setting (100 MB, services/site_settings.py); the
    # backend enforces the configured value.
    client_max_body_size 105m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Backup restore accepts up to 500 MB (routers/backup.py).
    location = /api/backup/restore {
        client_max_body_size 505m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
